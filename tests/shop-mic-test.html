<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おみせタウン マイク・練習への影響テスト</title>
<style>body{font-family:sans-serif;font-size:13px} iframe{width:1024px;height:600px;border:1px solid #ccc}</style>
</head>
<body>
<!--
  開発用（公開しない）：tempo-harness.html（偽の音声認識）を iframe で開き、
  ・おみせタウン／お店ではマイク（認識）が動いていないこと
  ・お店から戻ったあと、九九の練習（ばらばら・じゅんばん）がふだんどおり進むこと
  を確かめる。結果は #result（headless Chrome の --dump-dom で読める）。
-->
<pre id="result">running</pre>
<iframe id="f" src="tempo-harness.html"></iframe>
<script>
(async () => {
  const KEY = 'kuku-renshu-v1';
  const saved = localStorage.getItem(KEY);
  const lines = []; let ng = 0;
  const ok = (c, m) => { if (!c) ng++; lines.push(`${c ? 'OK ' : 'NG '} ${m}`); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = document.getElementById('f');
  const W = () => f.contentWindow;
  const G = (s) => W().eval(s);
  const $ = (id) => f.contentDocument.getElementById(id);
  const until = async (fn, ms = 8000) => { const t = performance.now(); while (performance.now() - t < ms) { if (fn()) return true; await wait(50); } return false; };
  try {
    await until(() => W().__ready, 10000);
    // ふつうのモード（A）で、トップでは事前準備のマイクが動くことがある
    await wait(1500);
    lines.push(`     トップ：認識 ${G('FakeSR.live') ? '動作中（事前準備）' : '停止'}・start回数 ${G('stats.startCall')}`);

    // ---- おみせタウン・お店 ----
    $('btn-shop').click();
    await wait(600);
    const c0 = G('stats.startCall'), k0 = G('FakeSR.created');
    ok(!G('FakeSR.live'), 'タウンに入ると 認識は止まる');
    await wait(2500);
    f.contentDocument.querySelector('.town-shop.open[data-dan="3"]').click();
    await wait(300);
    if (!$('shop-intro').hidden) $('shop-intro-ok').click();
    const S = G('Shop.state');
    for (let i = 0; i < S.order; i++) $('shop-add').click();
    $('shop-check').click(); await wait(200); $('shop-skip').click(); $('shop-deliver').click();
    await wait(3000);
    ok(!G('FakeSR.live') && G('stats.startCall') === c0 && G('FakeSR.created') === k0, `タウン・お店のあいだ 認識の起動 0回（start ${G('stats.startCall') - c0}・生成 ${G('FakeSR.created') - k0}）`);

    // ---- 戻って 練習（ばらばら 9もん：3の段） ----
    $('shop-back').click(); await wait(100); $('town-back').click(); await wait(300);
    ok($('screen-top').classList.contains('active'), 'タウン → トップへ もどる');
    G('Store').setSetting('dan', 3);
    // 段えらびボタンで 3の段へ
    const danBtn = [...f.contentDocument.querySelectorAll('#dan-picker button')].find((b) => /3/.test(b.textContent));
    danBtn && danBtn.click(); await wait(300);
    $('mode-random').click();
    let answered = 0;
    for (let q = 0; q < 9; q++) {
      const listening = await until(() => G('P.phase') === 'listening' && G('FakeSR.live') && G('FakeSR.live')._live, 12000);
      if (!listening) { lines.push(`     ${q + 1}もんめ：きく状態に ならない（phase ${G('P.phase')}）`); break; }
      const e = G('entryNow()');
      const idx = G('P.idx');
      await wait(400);
      W().__sim.say(String(e.answer));
      const moved = await until(() => G('P.idx') !== idx || $('screen-done').classList.contains('active'), 10000);
      if (!moved) { lines.push(`     ${q + 1}もんめ（${e.a}×${e.b}=${e.answer}）：すすまない`); break; }
      answered++;
    }
    await until(() => $('screen-done').classList.contains('active'), 8000);
    ok(answered === 9 && $('screen-done').classList.contains('active'), `ばらばら 9もん：こたえて さいごまで すすむ（${answered}/9）`);

    // ---- もう一度 タウンへ → 認識が止まる ----
    $('done-end').click(); await wait(300);
    $('btn-shop').click(); await wait(800);
    ok(!G('FakeSR.live'), '練習のあと タウンへ 行っても 認識は止まる');
  } catch (e) {
    ng++; lines.push('ERROR ' + e.message + '\n' + e.stack);
  } finally {
    if (saved === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, saved);
  }
  lines.push(`\n${ng === 0 ? 'ALL PASS' : ng + ' NG'}`);
  document.getElementById('result').textContent = lines.join('\n');
})();
</script>
</body>
</html>
