<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おみせタウン スクリーンショット用</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<!--
  開発用：おみせタウンを指定の状態にして表示する（スクリーンショット確認用。公開しない）
    ?state=town
    ?state=order&dan=1&n=3&plates=2&item=normal&animal=bear
    ?state=counting&dan=2&n=7&step=4
    ?state=confirmed&dan=3&n=9&item=mix
    ?state=delivered&dan=5&n=3&animal=rabbit
    ?state=unlock&dan=1&n=2&unlock=big
    ?state=intro&dan=3
    ?state=top
  マイク・読み上げは使わない。端末の記録には書き込まない（テストモード）。
-->
<div id="app"></div>
<script>
(async () => {
  const html = await (await fetch('../index.html')).text();
  document.getElementById('app').innerHTML = html.slice(html.indexOf('<body>') + 6, html.indexOf('<script src="js/data.js">'));
  for (const f of ['data', 'judge', 'store', 'perf', 'env', 'audio', 'recital', 'shop', 'parent', 'app']) {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = `../js/${f}.js`; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  }
  init();
  Store.setSetting('testMode', true);
  Voice.speak = () => Promise.resolve('skip');
  const q = new URLSearchParams(location.search);
  const state = q.get('state') || 'order';
  if (state === 'top') { document.body.dataset.ready = '1'; return; }
  const dan = +(q.get('dan') || 5);
  // 進み具合（テストモード中の一時コピーだけ）
  [1, 2, 3, 5].forEach((d) => { const p = Store.shopOf(d); p.deliveries = +(q.get('deliveries') || 6); p.introSeen = true; });
  if (state === 'town') { Store.shopOf(2).deliveries = 2; Store.shopOf(3).deliveries = 0; Shop.openTown(); document.body.dataset.ready = '1'; return; }
  const sh = Store.shopOf(dan);
  if (q.get('item')) sh.selected = q.get('item');
  if (state === 'intro') sh.introSeen = false;
  if (state === 'unlock') {
    const idx = Shop.SHOPS.find((s) => s.dan === dan).items.findIndex((it) => it.id === (q.get('unlock') || 'big'));
    sh.deliveries = Shop.UNLOCK_AT[idx] - 1;
  }
  Shop.openShop(dan);
  if (state === 'intro') { document.body.dataset.ready = '1'; return; }
  const S = Shop.state;
  const n = +(q.get('n') || 3);
  const animal = q.get('animal');
  if (animal) S.animal = { id: animal, name: { bear: 'くまさん', rabbit: 'うさぎさん', cat: 'ねこさん' }[animal], hello: 'こんにちは！', thanks: 'わーい！ ありがとう！' };
  S.order = n;
  S.plates = 0;
  S.phase = 'order';
  const plates = q.has('plates') ? +q.get('plates') : n;
  for (let i = 0; i < plates; i++) document.getElementById('shop-add').click();
  document.getElementById('shop-animal').innerHTML = Shop.animalSVG(S.animal.id, plates > n ? 'wonder' : 'order');
  document.getElementById('shop-name').textContent = S.animal.name;
  const label = document.querySelector('.food-chip.on .food-chip-name').textContent;
  document.getElementById('shop-line').textContent = plates > n ? `あれ？ ${n}セットで いいよ` : `${S.animal.hello} ${label}を ${n}セット おねがい！`;
  if (state !== 'order') {
    document.getElementById('shop-check').click();
    if (state === 'counting') {
      await new Promise((r) => setTimeout(r, 650 * (+(q.get('step') || 2)) - 300));
    } else {
      document.getElementById('shop-skip').click();
    }
    if (state === 'delivered' || state === 'unlock') document.getElementById('shop-deliver').click();
  }
  document.querySelectorAll('.plate').forEach((p) => { p.style.animation = 'none'; });
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
